services:
  - type: web
    name: ashivam-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ashivam-tec-h.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://ashivam-tec-h.vercel.app,https://ashivamtechnologies.com,https://www.ashivamtechnologies.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: LOGIN_RATE_LIMIT
        value: 5
      - key: PUBLIC_FORM_RATE_LIMIT
        value: 10
      - key: GLOBAL_RATE_LIMIT
        value: 100
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: Ashivam Technologies <no-reply@ashivamtechnologies.com>
      - key: NOTIFICATION_RECIPIENT
        value: contact@ashivamtechnologies.com
