services:
  - type: web
    name: ashivam-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ashivam-tec-h.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://ashivam-tec-h.vercel.app,https://ashivamtechnologies.com,https://www.ashivamtechnologies.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: 1
      - key: LOGIN_RATE_LIMIT
        value: 5
      - key: LOGIN_RATE_WINDOW_MS
        value: 900000
      - key: PUBLIC_FORM_RATE_LIMIT
        value: 10
      - key: GLOBAL_RATE_LIMIT
        value: 100
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Ashivam Technologies <ritik95061@gmail.com>
      - key: COMPANY_NOTIFICATION_EMAIL
        value: ritik95061@gmail.com
      - key: ALERT_EMAIL
        value: ritik95061@gmail.com
      - key: EMAIL_FROM
        value: Ashivam Technologies <ritik95061@gmail.com>
      - key: NOTIFICATION_RECIPIENT
        value: ritik95061@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://ashivam-tech.onrender.com/api/v1/google/oauth/callback
      - key: GOOGLE_OAUTH_SCOPES
        value: https://www.googleapis.com/auth/meetings.space.created https://www.googleapis.com/auth/meetings.space.readonly openid email
      - key: GOOGLE_CLOUD_PROJECT_ID
        value: ashivam-meet-attendance
      - key: GOOGLE_PUBSUB_TOPIC
        value: projects/ashivam-meet-attendance/topics/ashivam-meet-events
      - key: GOOGLE_PUBSUB_SUBSCRIPTION
        value: projects/ashivam-meet-attendance/subscriptions/ashivam-meet-events-sub
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
