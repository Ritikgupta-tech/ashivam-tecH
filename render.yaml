services:
  - type: web
    name: ashivam-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ashivam-tec-h.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://ashivam-tec-h.vercel.app,https://ashivamtechnologies.com,https://www.ashivamtechnologies.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: 1
      - key: LOGIN_RATE_LIMIT
        value: 5
      - key: LOGIN_RATE_WINDOW_MS
        value: 900000
      - key: PUBLIC_FORM_RATE_LIMIT
        value: 10
      - key: GLOBAL_RATE_LIMIT
        value: 100
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: Ashivam Technologies <teamashivam@gmail.com>
      - key: COMPANY_NOTIFICATION_EMAIL
        value: team.ashivam@gmail.com
      - key: ALERT_EMAIL
        value: team.ashivam@gmail.com
      - key: EMAIL_FROM
        value: Ashivam Technologies <teamashivam@gmail.com>
      - key: NOTIFICATION_RECIPIENT
        value: team.ashivam@gmail.com
