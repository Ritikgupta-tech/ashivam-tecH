name: CI - Ashivam Official Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format-and-frontend:
    name: Frontend Quality, Tests & Production Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Git Diff & Format Check
        run: git diff --check

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Frontend Tests
        run: npm test

      - name: Production Vite Build
        run: npm run build

  backend-verify:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/ashivam_technologies_ci?replicaSet=rs0&directConnection=true
      JWT_SECRET: ashivam-ci-test-jwt-secret-key-32-chars-minimum!
      JWT_REFRESH_SECRET: ashivam-ci-test-jwt-refresh-secret-key-32-chars-minimum!
      COMPANY_NOTIFICATION_EMAIL: team.ashivam@gmail.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "db.adminCommand('ping')" --quiet; do
            echo "Waiting for MongoDB to be healthy..."
            sleep 1
          done
          docker exec mongodb mongosh --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          until docker exec mongodb mongosh --eval "rs.isMaster().ismaster" --quiet | grep -q true; do
            echo "Waiting for Replica Set election..."
            sleep 1
          done
          echo "MongoDB replica set rs0 is ready on port 27017."

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Security Vulnerability Audit
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Run Backend Test Suites
        working-directory: ./backend
        run: npm test

  docker-verify:
    name: Docker Build & Non-Root User Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Backend Docker Image
        run: |
          docker build -t ashivam-backend:ci -f backend/Dockerfile backend

      - name: Verify Non-Root User Execution
        run: |
          USER_ID=$(docker run --rm --entrypoint id ashivam-backend:ci -u)
          echo "Container runs with UID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "ERROR: Container is running as root (UID 0)"
            exit 1
          fi
          echo "Verified: Container runs as non-root unprivileged user."
