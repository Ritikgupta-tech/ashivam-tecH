name: CI - Ashivam Official Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Frontend Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Production Build
        run: npm run build

  backend-verify:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/ashivam_technologies_ci
      JWT_SECRET: ashivam-ci-test-jwt-secret-key-32-chars-minimum!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Security Vulnerability Audit
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Run Backend Test Suites
        working-directory: ./backend
        run: npm test
