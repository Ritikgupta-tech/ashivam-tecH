openapi: 3.1.0
info:
  title: Ashivam Technologies Corporate & Administrative API
  version: 1.0.0
  description: >
    Enterprise REST API serving Ashivam Technologies' official website,
    internship lifecycle, and HR management platform.
  contact:
    name: Ashivam Engineering Operations
    email: team.ashivam@gmail.com
    url: https://ashivam-tec-h.vercel.app/
servers:
  - url: https://ashivam-tech.onrender.com/api/v1
    description: Production Cloud API (Render)
  - url: http://localhost:5000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health and Readiness Check
      description: Returns service uptime, database connectivity state, and environment status.
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      summary: Authenticate User
      description: Validates email and password, issuing a short-lived JWT access token and setting a rotating HttpOnly refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429RateLimited'

  /auth/refresh-token:
    post:
      summary: Rotate Refresh Token & Issue Access Token
      description: Validates the HttpOnly refresh token cookie, rotates the token family, and returns a new access token.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Successfully refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Replay attack detected; token family revoked.

  /auth/logout:
    post:
      summary: Terminate Session
      description: Clears the refresh token cookie and marks the active token family as revoked.
      responses:
        '200':
          description: Successfully logged out.

  /inquiries:
    post:
      summary: Submit Public Inbound Inquiry
      description: Captures public enterprise lead submissions with honeypot and rate limit protections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
      responses:
        '201':
          description: Inquiry recorded and confirmation queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '429':
          $ref: '#/components/responses/429RateLimited'
    get:
      summary: List Inbound Inquiries
      description: Retrieves inquiries for administrative triage (Requires ADMIN or SUPERADMIN).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, IN_REVIEW, CONTACTED, RESOLVED, ARCHIVED]
      responses:
        '200':
          description: Paginated inquiries list.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /inquiries/{id}:
    get:
      summary: Get Inquiry by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inquiry details.
    patch:
      summary: Update Inquiry Status or Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [NEW, IN_REVIEW, CONTACTED, RESOLVED, ARCHIVED]
                adminNotes:
                  type: string
      responses:
        '200':
          description: Inquiry updated.

  /careers:
    get:
      summary: List Open Job Postings
      description: Publicly lists active career and internship openings.
      responses:
        '200':
          description: List of active job openings.

  /careers/apply:
    post:
      summary: Submit Job Application with Resume
      description: Submits candidate profile and resume (PDF/DOCX max 5MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fullName, email, phone, careerId, resume]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                careerId:
                  type: string
                resume:
                  type: string
                  format: binary
      responses:
        '201':
          description: Application successfully submitted.
        '400':
          description: Invalid file format (magic-byte check failed).
        '422':
          $ref: '#/components/responses/422ValidationError'

  /employees:
    get:
      summary: List Employees
      description: Returns active employee roster (Requires HR_MANAGER, DEPT_HEAD, or ADMIN).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of employees.
    post:
      summary: Create New Employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Employee created.

  /employee-documents/upload:
    post:
      summary: Upload KYC Document to Vault
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [employeeId, documentType, file]
              properties:
                employeeId:
                  type: string
                documentType:
                  type: string
                  enum: [AADHAAR, PAN, DEGREE, RELIEVING_LETTER, BANK_CHEQUE]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded and encrypted.

  /employee-documents/{id}/preview:
    get:
      summary: Generate Ephemeral Pre-Signed View URL
      description: Generates a 120-second pre-signed URL for authorized KYC inspection.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pre-signed preview URL generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  previewUrl:
                    type: string
                  expiresIn:
                    type: integer
                    example: 120

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: UP
        database:
          type: string
          example: CONNECTED
        uptime:
          type: number
          example: 84920.4
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@ashivam.com
        password:
          type: string
          format: password
          example: HardenedPass#2026

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            accessToken:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                role:
                  type: string

    InquiryCreateRequest:
      type: object
      required: [fullName, email, phone, message]
      properties:
        fullName:
          type: string
          example: Alexander Wright
        email:
          type: string
          format: email
          example: a.wright@enterprise.com
        phone:
          type: string
          example: "+91 98765 43210"
        subject:
          type: string
          example: Enterprise Cloud Migration Partnership
        message:
          type: string
          example: Seeking full-stack engineering team for cloud architecture review.
        _gotcha:
          type: string
          description: Honeypot field. Must be left blank by legitimate users.

    InquiryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            inquiryId:
              type: string
            status:
              type: string
              example: NEW

    EmployeeCreateRequest:
      type: object
      required: [employeeId, fullName, email, department, designation]
      properties:
        employeeId:
          type: string
          example: ASH-EMP-0142
        fullName:
          type: string
          example: Priya Sharma
        email:
          type: string
          format: email
          example: priya.sharma@ashivam.com
        department:
          type: string
          example: Engineering
        designation:
          type: string
          example: Senior DevOps Architect

  responses:
    401Unauthorized:
      description: Authentication token missing or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized. Access token missing or invalid.

    403Forbidden:
      description: Insufficient privileges for requested resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 403
              message:
                type: string
                example: Forbidden. Insufficient role permissions.

    422ValidationError:
      description: Input validation failed on payload fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 422
              message:
                type: string
                example: Validation failed.
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string

    429RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 429
              message:
                type: string
                example: Too many requests. Please try again later.
