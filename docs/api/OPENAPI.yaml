openapi: 3.1.0
info:
  title: Ashivam Technologies Corporate & Administrative API
  version: 1.0.0
  description: >
    Enterprise REST API serving Ashivam Technologies' official website,
    recruitment, internship operations, and employee administration.
  contact:
    name: Ashivam Engineering Operations
    email: ritik95061@gmail.com
    url: https://ashivam-tec-h.vercel.app/
servers:
  - url: https://ashivam-tech.onrender.com/api/v1
    description: Production Cloud API (Render)
  - url: http://localhost:5000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health and Readiness Check
      description: Returns service uptime, database connectivity state, and environment status.
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      summary: Authenticate Admin or Staff
      description: Validates username/email and password, issuing a short-lived JWT access token and setting a rotating HttpOnly refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429RateLimited'

  /auth/refresh:
    post:
      summary: Rotate Refresh Token & Issue Access Token
      description: Validates the HttpOnly refresh token cookie, rotates the token family, and returns a fresh JWT access token.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Successfully refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/logout:
    post:
      summary: Terminate Session
      description: Clears the refresh token cookie and marks the active token family as revoked in the database.
      responses:
        '200':
          description: Successfully logged out.

  /auth/me:
    get:
      summary: Get Current Authenticated User Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile of authenticated user.

  /auth/change-password:
    post:
      summary: Change Password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated successfully.

  /inquiries:
    post:
      summary: Submit Public Inbound Inquiry
      description: Captures public enterprise lead submissions with honeypot and rate limit protections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
      responses:
        '201':
          description: Inquiry recorded and confirmation queued.
        '422':
          $ref: '#/components/responses/422ValidationError'
        '429':
          $ref: '#/components/responses/429RateLimited'
    get:
      summary: List Inbound Inquiries
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated inquiries list.

  /inquiries/export:
    get:
      summary: Export Inquiries as CSV
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV file download.

  /inquiries/{id}:
    get:
      summary: Get Inquiry by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inquiry details.
    patch:
      summary: Update Inquiry Status or Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inquiry updated.
    delete:
      summary: Delete Inquiry (Superadmin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inquiry deleted.

  /career/jobs:
    get:
      summary: List Public Active Job Postings
      responses:
        '200':
          description: Array of published job opportunities.

  /career/jobs/{id}:
    get:
      summary: Get Public Job Posting by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details.

  /career/jobs/{jobId}/apply:
    post:
      summary: Submit Application with Resume
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [firstName, lastName, email, phone, resume]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                currentLocation:
                  type: string
                experience:
                  type: string
                coverLetter:
                  type: string
                resume:
                  type: string
                  format: binary
      responses:
        '201':
          description: Application successfully submitted.
        '400':
          description: Invalid file format (only PDF, DOC, DOCX accepted).
        '409':
          description: Duplicate application for this job posting.

  /career/admin/jobs:
    get:
      summary: List All Jobs for Admin Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of jobs including drafts and paused listings.
    post:
      summary: Create New Job Posting
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Job created.

  /career/admin/applications:
    get:
      summary: List Job Applications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated applications.

  /career/admin/applications/export:
    get:
      summary: Export Applications as CSV
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV download.

  /career/admin/applications/{id}/resume:
    get:
      summary: Securely Download Candidate Resume
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resume binary file stream.

  /internships:
    get:
      summary: List Internship Applications (Admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated applications.
    post:
      summary: Submit Public Internship Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipApplicationRequest'
      responses:
        '201':
          description: Internship application submitted.

  /internships/programs/public:
    get:
      summary: List Public Internship Programs
      responses:
        '200':
          description: Active internship programs.

  /internships/interns:
    get:
      summary: List Onboarded Interns Directory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Interns list.
    post:
      summary: Manually Create Onboarded Intern
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Intern created.

  /employees:
    get:
      summary: List Employees (Admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated employee roster.
    post:
      summary: Create Employee Record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Employee record created.

  /employees/public:
    get:
      summary: Public Team Roster
      description: Returns sanitized public employee directory for about page.
      responses:
        '200':
          description: Public team list.

  /employees/departments:
    get:
      summary: List All Distinct Departments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department list.

  /employees/designations:
    get:
      summary: List All Distinct Designations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designation list.

  /employees/{employeeId}:
    get:
      summary: Get Employee Profile by ID
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee profile.
    patch:
      summary: Update Employee Record
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee updated.
    delete:
      summary: Soft Delete Employee Record (Superadmin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee soft-deleted.

  /employees/{employeeId}/restore:
    patch:
      summary: Restore Soft-Deleted Employee Record (Superadmin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee restored.

  /employee-documents/{employeeId}:
    get:
      summary: List KYC Documents for an Employee
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Documents list.
    post:
      summary: Upload KYC Document for an Employee
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentType, document]
              properties:
                documentType:
                  type: string
                document:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded.

  /employee-documents/file/{documentId}:
    get:
      summary: Securely Download/Stream KYC Document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document binary stream.

  /hr-documents:
    get:
      summary: List Company Policies & HR Documents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HR documents catalog.
    post:
      summary: Upload Company HR Policy Document
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Policy document uploaded.

  /hr-documents/file/{documentId}:
    get:
      summary: Download Company HR Policy Document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy document binary stream.

  /audit:
    get:
      summary: Query Tamper-Resistant Audit Logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit log records.

  /dashboard/overview:
    get:
      summary: Administrative Analytics Overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated counts and system metrics.

  /dashboard/recent-activity:
    get:
      summary: Recent Administrative Actions Feed
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent activity feed.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: UP
        database:
          type: string
          example: CONNECTED
        uptime:
          type: number
          example: 84920.4
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: superadmin
        password:
          type: string
          format: password
          example: SecurePass123!

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            accessToken:
              type: string
            admin:
              type: object
              properties:
                id:
                  type: string
                username:
                  type: string
                role:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string

    InquiryCreateRequest:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          example: Alexander Wright
        email:
          type: string
          format: email
          example: ritik95061@gmail.com
        phone:
          type: string
          example: "+91 98765 43210"
        subject:
          type: string
          example: Enterprise Cloud Migration Partnership
        message:
          type: string
          example: Seeking full-stack engineering team for cloud architecture review.
        _gotcha:
          type: string
          description: Honeypot field. Must be left blank by legitimate users.

    InternshipApplicationRequest:
      type: object
      required: [fullName, email, phone, domain, college]
      properties:
        fullName:
          type: string
          example: Rahul Kumar
        email:
          type: string
          format: email
          example: ritik95061@gmail.com
        phone:
          type: string
          example: "+91 98765 12345"
        domain:
          type: string
          example: Full-Stack Web Development
        college:
          type: string
          example: IIT Delhi
        degree:
          type: string
          example: B.Tech Computer Science
        graduationYear:
          type: integer
          example: 2026

    EmployeeCreateRequest:
      type: object
      required: [employeeId, name, email, department, designation]
      properties:
        employeeId:
          type: string
          example: ASH-EMP-0142
        name:
          type: string
          example: Priya Sharma
        email:
          type: string
          format: email
          example: ritik95061@gmail.com
        department:
          type: string
          example: Engineering
        designation:
          type: string
          example: Senior DevOps Architect

  responses:
    401Unauthorized:
      description: Authentication token missing or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized. Access token missing or invalid.

    422ValidationError:
      description: Input validation failed on payload fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 422
              message:
                type: string
                example: Validation failed.

    429RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 429
              message:
                type: string
                example: Too many requests. Please try again later.
